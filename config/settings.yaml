# ── 데이터 수집 ──
collect:
  history_years: 5          # 처음 수집할 일봉 기간
  news_per_stock: 100       # 종목당 뉴스 수(네이버 API 최대 100)
  dart_lookback_days: 365   # 공시 첫 수집 기간

# ── 외국인 수급 스크리너 ──
screener:
  auto_add_top: 10          # 외국인 매수 강도 상위 N 종목을 뉴스·공시 수집 대상에 자동 추가

# ── 예측 모델 ──
model:
  horizon: 5                # 며칠 뒤 방향을 예측할지 (거래일)
  # excess   = 코스피 대비 초과수익 여부 (권장: 종목 고유 신호인 수급·뉴스가 잘 드러남)
  # absolute = 주가 자체의 상승 여부 (시장 전체 등락에 좌우되어 예측력이 약함)
  target: excess
  bullish: 0.55             # 확률이 이 값 이상이면 "강세" (모델 확률은 대개 0.4~0.6 사이에 몰림)
  bearish: 0.45             # 이 값 이하면 "약세"
  retrain_every_days: 7     # 매일 업데이트 때 이 주기로 재학습

# ── 뉴스 감성 분석 ──
sentiment:
  engine: lexicon           # lexicon = 내장 사전(가벼움) / finbert = KR-FinBERT (transformers, torch 설치 필요)
